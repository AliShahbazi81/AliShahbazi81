# Redraws the README artwork from the public contribution calendar once a day.
name: Profile artwork

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/profile_art.py", "assets/fonts/**"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install fonttools==4.55.3 brotli==1.1.0
      - run: python scripts/profile_art.py
      - name: Commit the new drawings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then echo "Nothing changed."; else git commit -m "chore: refresh profile artwork" && git push; fi
